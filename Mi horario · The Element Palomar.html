<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi horario · The Element Palomar</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ln:#dcdad2;--now:#e2231a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#222221;--tx:#f0efe9;--mut:#9d9c95;--ln:#3a3a37;--now:#ff5a4f}}
:root[data-theme="dark"]{--bg:#161615;--card:#222221;--tx:#f0efe9;--mut:#9d9c95;--ln:#3a3a37;--now:#ff5a4f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}small,.mut{color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:2px solid transparent;border-radius:999px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:14px;color:#fff}
.chip.off{opacity:.45}.chip.on{border-color:var(--tx)}
.day{background:var(--card);border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
.day.on{background:var(--tx);color:var(--bg)}
#alert{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--card);border:1px solid var(--ln)}
#alert.warn{background:#ffe94a;color:#1d1d1b;border-color:#c9b400;font-weight:600;font-size:18px}
#tl{position:relative;margin:16px 0 16px 52px;border-left:2px solid var(--ln)}
.tick{position:absolute;left:-52px;width:46px;text-align:right;font-size:12px;color:var(--mut);transform:translateY(-8px)}
.ev{position:absolute;left:10px;right:0;border-radius:10px;padding:6px 10px;overflow:hidden;font-size:14px;border:1px solid rgba(0,0,0,.15)}
.ev b{display:block}
.ev.d{background:repeating-linear-gradient(45deg,var(--card),var(--card) 8px,var(--ln) 8px,var(--ln) 16px);border:1px dashed var(--mut)}
#nowl{position:absolute;left:-6px;right:0;height:0;border-top:2px solid var(--now);z-index:3}
#nowl::before{content:"";position:absolute;left:0;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--now)}
#nowl span{position:absolute;right:0;top:-20px;font-size:12px;color:var(--now);font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
button.t{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;cursor:pointer}
input[type=time]{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px}
#msg{font-size:13px;color:var(--mut)}
</style></head><body><main>
<h1>Mi horario</h1><small id="wk"></small>
<div class="row" id="subs"></div>
<div class="row" id="days"></div>
<div id="alert"></div>
<div id="tl"></div>
<div class="tools">
<button class="t" id="up">Reemplazar horario (imagen)</button><input type="file" id="f" accept="image/*" hidden>
<button class="t" id="rs">Restaurar 9–13 nov</button>
<button class="t" id="upr">Reemplazar roles (imagen)</button><input type="file" id="fr" accept="image/*" hidden>
<button class="t" id="rsr">Restaurar roles</button>
<label class="mut">Hora de prueba <input type="time" id="sim"></label>
</div>
<p id="msg"></p>
</main>
<script>
const S=["Matemáticas","Humanidades","StudyHall","CODE","Ajedrez","Inglés","Lecto"];
const COL={"Matemáticas":["#4a86c7","#fff"],"Humanidades":["#ffe94a","#1d1d1b"],"StudyHall":["#7b2a4a","#fff"],"CODE":["#f5951d","#1d1d1b"],"Ajedrez":["#e83be0","#fff"],"Inglés":["#e2231a","#fff"],"Lecto":["#2e8b2e","#fff"]};
const T={"Matemáticas":"Gabriel","Humanidades":"Alma","StudyHall":"Study hall","CODE":"Christian","Ajedrez":"Edgar","Inglés":"Lorena","Lecto":"Diego"};
const MEN=[[480,540],[585,630],[630,690],[720,780],[780,840],[840,900]];
const MAY=[[480,540],[540,600],[645,690],[690,750],[780,840],[840,900]];
const RMEN=[[540,585],[690,720]],RMAY=[[600,645],[750,780]];
let ENT={Alma:"Abrir puertas",Lorena:"Abrir puertas",Gabriel:"Abrir puertas",Diego:"Cancha de fútbol","Study hall":"Patio delantero",Edgar:"Cafetera",Christian:"Baños pasillo delantero"};
let SAL={Gabriel:"Puerta",Diego:"Orden rotación menor",Lorena:"Orden rotación mayor",Christian:"Abrir puertas","Study hall":"Abrir puertas",Alma:"Abrir puertas"};
let DESC={"Abrir puertas":"Ayudar al alumno a bajar del auto y sus cosas, dirigirlo a la escuela.","Cancha de fútbol":"Cuidar baños, que no jueguen en la cancha ni vayan a los salones traseros.","Patio delantero":"Que no jueguen en el jardín ni vayan al área de preescolar.","Cafetera":"Que no usen tazas ni coman azúcar.","Baños pasillo delantero":"Vigilar baños, que no jueguen dentro.","Puerta":"Cuidar la salida de estudiantes (no moverse de la puerta).","Orden rotación menor":"Mantener el orden en la zona de salida, apurar a los alumnos.","Orden rotación mayor":"Mantener el orden en la salida; repetir nombres del megáfono.","Comedor":"Que nadie deje platos en el comedor; buen uso del mobiliario.","Patio trasero":"Cuidar el equipo de deportes y vigilar la cancha.","Tarja":"Que laven bien platos y cubiertos y tiren la comida a la basura."};
let RR=[{role:"Comedor",menor:"C",mayor:"D",only:0},{role:"Patio trasero",menor:"B2",mayor:"E",only:0},{role:"Patio delantero",menor:"B1",mayor:"F",only:2},{role:"Tarja",menor:"D",mayor:"F",only:1}];
const RD=JSON.stringify({ENT,SAL,DESC,RR});
const GM=["A","B1","B2","C"],GY=["D","E","F"];
const AO=[0,6,5,4,3],DO=[4,3,2,1,0];
function def(){const days=[];for(let d=0;d<5;d++){const o={};GM.forEach((g,i)=>o[g]=[0,1,2,3,4,5].map(r=>S[(AO[d]+i+r)%7]));GY.forEach((g,i)=>o[g]=[0,1,2,3,4,5].map(r=>S[(DO[d]+i+r)%7]));days.push(o)}return{label:"9 al 13 de noviembre 2026",days}}
let sch=def(),sub="Lecto",day=0;
try{const rl=localStorage.getItem("roles");if(rl){const o=JSON.parse(rl);ENT=o.ENT;SAL=o.SAL;DESC=o.DESC;RR=o.RR}}catch(e){}
try{const a=localStorage.getItem("sch");if(a)sch=JSON.parse(a);const b=localStorage.getItem("sub");if(S.includes(b))sub=b}catch(e){}
const wd=new Date().getDay();day=wd>=1&&wd<=5?wd-1:0;
const DN=["Lun","Mar","Mié","Jue","Vie"];
const fm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
function slots(d){const r=[];[...GM,...GY].forEach(g=>{const tm=GM.includes(g)?MEN:MAY;(sch.days[d][g]||[]).forEach((s,i)=>r.push({g,s:tm[i][0],e:tm[i][1],subj:s}))});return r}
function events(d,sb){const sl=slots(d),mine=sl.filter(x=>x.subj===sb),tc=T[sb],ev=[];
ev.push({s:450,e:480,k:"role",n:"Entrada",role:ENT[tc]});
mine.forEach(x=>ev.push({s:x.s,e:x.e,k:"class",n:"Clase · grupo "+x.g}));
[["m",RMEN],["M",RMAY]].forEach(([t,rr])=>rr.forEach(([s,e],n)=>{if(mine.some(x=>x.s<e&&x.e>s))return;
const last=mine.filter(x=>x.e<=s).sort((a,b)=>b.e-a.e)[0];let role=null;
if(last){const g=last.g,r=RR.find(x=>x[t==="m"?"menor":"mayor"]===g&&(t==="m"||!x.only||x.only===n+1));role=r?r.role:null}
ev.push({s,e,k:"rest",n:"Descanso",role,last:last&&last.g})}));
ev.push({s:900,e:930,k:"role",n:"Salida",role:SAL[tc]});
return ev.sort((a,b)=>a.s-b.s)}
const $=id=>document.getElementById(id),PX=1.5,T0=450;
function nowMin(){const v=$("sim").value;if(v){const[h,m]=v.split(":").map(Number);return h*60+m+0.5}const n=new Date();return n.getHours()*60+n.getMinutes()+n.getSeconds()/60}
function head(){$("wk").textContent="Semana: "+sch.label;
$("subs").innerHTML="";S.forEach(s=>{const b=document.createElement("button");b.className="chip"+(s===sub?" on":" off");b.style.background=COL[s][0];b.style.color=COL[s][1];b.textContent=s;b.onclick=()=>{sub=s;try{localStorage.setItem("sub",s)}catch(e){}head();draw()};$("subs").append(b)});
$("days").innerHTML="";DN.forEach((n,i)=>{const b=document.createElement("button");b.className="day"+(i===day?" on":"");b.textContent=n;b.onclick=()=>{day=i;head();draw()};$("days").append(b)})}
function draw(){const ev=events(day,sub),tl=$("tl");tl.style.height=(930-T0)*PX+"px";tl.innerHTML="";
for(let m=480;m<=930;m+=60){const t=document.createElement("div");t.className="tick";t.style.top=(m-T0)*PX+"px";t.textContent=fm(m);tl.append(t)}
ev.forEach(x=>{const d=document.createElement("div");d.className="ev"+(x.k==="rest"?" d":"");d.style.top=(x.s-T0)*PX+"px";d.style.height=(x.e-x.s)*PX-3+"px";
if(x.k==="class"){const c=COL[sub];d.style.background=c[0];d.style.color=c[1]}
d.innerHTML="<b>"+x.n+" · "+fm(x.s)+"–"+fm(x.e)+"</b>"+(x.role?"Rol: "+x.role:x.k==="rest"?"Sin rol":"");tl.append(d)});
const nl=document.createElement("div");nl.id="nowl";nl.innerHTML="<span></span>";tl.append(nl);tick()}
function tick(){const n=nowMin(),ev=events(day,sub),nl=$("nowl");if(!nl)return;
const real=!$("sim").value&&new Date().getDay()-1===day||$("sim").value;
nl.style.display=real&&n>=T0&&n<=930?"block":"none";nl.style.top=(n-T0)*PX+"px";nl.firstChild.textContent=fm(Math.floor(n));
const a=$("alert");a.className="";let h="";
if(!real){a.innerHTML="Mostrando "+DN[day]+". La línea de “ahora” aparece solo el día de hoy.";return}
const cur=ev.find(x=>n>=x.s&&n<x.e),nx=ev.find(x=>x.s>n&&(x.s-n)<=5&&(x.role||x.k==="rest"));
if(nx){a.className="warn";h="En "+Math.ceil(nx.s-n)+" min: "+nx.n+" ("+fm(nx.s)+")"+(nx.role?" · Rol: "+nx.role:"")+"<br><small style=\"color:#1d1d1b;font-weight:400\">"+(DESC[nx.role]||"")+"</small>"}
else if(cur){h="<b>Ahora:</b> "+cur.n+" hasta "+fm(cur.e)+(cur.role?" · Rol: "+cur.role:"")}
else{const f=ev.find(x=>x.s>n);h=f?"Siguiente: "+f.n+" a las "+fm(f.s):"Terminaste por hoy."}
a.innerHTML=h}
$("sim").oninput=draw;setInterval(tick,15000);
$("rs").onclick=()=>{sch=def();try{localStorage.removeItem("sch")}catch(e){}head();draw();$("msg").textContent="Horario restaurado."};
$("up").onclick=()=>$("f").click();
$("f").onchange=async e=>{const file=e.target.files[0];if(!file)return;const m=$("msg");m.textContent="Leyendo imagen…";
try{const sm=await claude.use("sample");if(!sm){m.textContent="Leer imágenes no está disponible en esta vista.";return}
const p="Esta imagen es un horario semanal escolar (lunes a viernes). Cada día tiene grupos A,B1,B2,C (columnas izquierdas, 6 clases cada uno, ignora filas grises de receso) y D,E,F (columnas derechas, 6 clases). Responde SOLO JSON sin texto extra: {\"label\":\"texto de la semana\",\"days\":[{\"A\":[6 materias],\"B1\":[...],\"B2\":[...],\"C\":[...],\"D\":[...],\"E\":[...],\"F\":[...]} x5 días]}. Cada materia debe ser exactamente una de: Matemáticas, Humanidades, StudyHall, CODE, Ajedrez, Inglés, Lecto. Orden de arriba hacia abajo.";
const r=await sm(p,{images:[file],modelTier:"complex",cache:false});
const j=JSON.parse(r.text.replace(/```json|```/g,"").trim());
if(!j.days||j.days.length!==5)throw 0;
for(const d of j.days)for(const g of [...GM,...GY])if(!d[g]||d[g].length!==6||d[g].some(s=>!S.includes(s)))throw 0;
sch={label:j.label||"Semana nueva",days:j.days};try{localStorage.setItem("sch",JSON.stringify(sch))}catch(e){}
head();draw();m.textContent="Horario actualizado. Revísalo; si algo salió mal, vuelve a subir la imagen."}
catch(x){m.textContent="No pude leer la imagen con seguridad. Prueba con una captura más nítida."}
e.target.value=""};
$("upr").onclick=()=>$("fr").click();
$("rsr").onclick=()=>{const o=JSON.parse(RD);ENT=o.ENT;SAL=o.SAL;DESC=o.DESC;RR=o.RR;try{localStorage.removeItem("roles")}catch(e){}draw();$("msg").textContent="Roles restaurados."};
$("fr").onchange=async e=>{const file=e.target.files[0];if(!file)return;const m=$("msg");m.textContent="Leyendo roles…";
try{const sm=await claude.use("sample");if(!sm){m.textContent="Leer imágenes no está disponible en esta vista.";return}
const p="Esta imagen es una tabla de roles escolares con secciones Entrada, Receso y Salida. Responde SOLO JSON sin texto extra: {\"entrada\":[{\"role\":\"nombre\",\"desc\":\"descripción breve\",\"teachers\":[\"nombres\"]}],\"salida\":[igual],\"receso\":[{\"role\":\"nombre\",\"desc\":\"descripción breve\",\"menor\":\"grupo en columna MENOR\",\"mayor\":\"grupo en columna MAYOR\",\"solo\":0}]}. En receso, solo=1 si la descripción dice SOLO PRIMER RECESO en rotación mayor, solo=2 si dice SOLO SEGUNDO RECESO, 0 si no. Los grupos son A, B1, B2, C, D, E o F. Los profesores deben ser exactamente de: Alma, Lorena, Gabriel, Diego, Study hall, Edgar, Christian.";
const r=await sm(p,{images:[file],modelTier:"complex",cache:false});
const j=JSON.parse(r.text.replace(/```json|```/g,"").trim());
const TN=Object.values(T),G=[...GM,...GY],nE={},nS={},nD={};
for(const [arr,out] of [[j.entrada,nE],[j.salida,nS]]){if(!Array.isArray(arr)||!arr.length)throw 0;for(const it of arr){nD[it.role]=it.desc||"";for(const t of it.teachers){if(!TN.includes(t))throw 0;out[t]=it.role}}}
if(!Array.isArray(j.receso)||!j.receso.length)throw 0;
const nR=j.receso.map(x=>{if(!G.includes(x.menor)||!G.includes(x.mayor))throw 0;nD[x.role]=x.desc||"";return{role:x.role,menor:x.menor,mayor:x.mayor,only:x.solo||0}});
ENT=nE;SAL=nS;DESC=nD;RR=nR;try{localStorage.setItem("roles",JSON.stringify({ENT,SAL,DESC,RR}))}catch(x){}
draw();m.textContent="Roles actualizados. Revisa que coincidan con tu imagen."}
catch(x){m.textContent="No pude leer la imagen de roles con seguridad. Prueba con una captura más nítida."}
e.target.value=""};
head();draw();
</script></body></html>
