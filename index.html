<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi horario · The Element Palomar</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#f4f2ee;--card:#fffdf9;--tx:#1f1e1b;--mut:#78756d;--ln:#e6e2d9;--now:#e2231a;--warn:#ffe94a;--sh:0 1px 2px rgba(30,25,10,.05),0 8px 24px rgba(30,25,10,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121211;--card:#1c1c1a;--tx:#efede6;--mut:#a3a099;--ln:#2d2d2a;--now:#ff5a4f;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121211;--card:#1c1c1a;--tx:#efede6;--mut:#a3a099;--ln:#2d2d2a;--now:#ff5a4f;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .35s,color .35s}
main{max-width:640px;margin:0 auto;padding:28px 20px 48px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:28px}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 4px}
.mut{color:var(--mut);font-size:14px}
.sec{margin:0 0 22px}
.lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 10px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid transparent;border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;font-size:14px;transition:transform .18s,opacity .25s,box-shadow .25s}
.chip:hover{transform:translateY(-2px)}.chip:active{transform:scale(.96)}
.chip.off{opacity:.4}.chip.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--tx)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:4px;box-shadow:var(--sh)}
.day{background:none;border:0;color:var(--mut);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;transition:background .25s,color .25s}
.day.on{background:var(--tx);color:var(--bg)}
#th{background:var(--card);border:1px solid var(--ln);border-radius:12px;width:44px;height:44px;font-size:19px;cursor:pointer;box-shadow:var(--sh);transition:transform .3s}
#th:hover{transform:rotate(20deg)}#th:active{transform:scale(.92)}
.hb{display:flex;gap:8px}
#an{background:var(--card);border:1px solid var(--ln);border-radius:12px;height:44px;padding:0 14px;font-size:14px;color:var(--tx);cursor:pointer;box-shadow:var(--sh);transition:transform .2s}#an:hover{transform:translateY(-2px)}#an:active{transform:scale(.95)}
#alert{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;border-radius:16px;padding:16px 18px;margin:0 0 22px;background:var(--card);border:1px solid var(--ln);box-shadow:var(--sh);transition:background .4s,border-color .4s}
#alert.warn{background:var(--warn);color:#1d1d1b;border-color:#d9c400;font-weight:600;font-size:18px;animation:glow 2s ease-in-out infinite}
#alert.pop>*{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
#alert small{display:block;font-weight:400;font-size:14px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;box-shadow:var(--sh);padding:28px 18px 28px 12px;margin-bottom:22px}
#tl{position:relative;margin-left:52px;border-left:2px solid var(--ln)}
.tick{position:absolute;left:-52px;width:44px;text-align:right;font-size:12px;color:var(--mut);transform:translateY(-8px)}
.ev{position:absolute;left:14px;right:0;border-radius:12px;padding:7px 12px;overflow:hidden;font-size:14px;line-height:1.3;box-shadow:0 1px 3px rgba(0,0,0,.12);animation:rise .6s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i)*60ms);transition:transform .25s,box-shadow .25s}
.ev:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.18)}
#tl[data-a="slide"] .ev{animation-name:slide}
#tl[data-a="zoom"] .ev{animation-name:zoom}
#tl[data-a="bounce"] .ev{animation-name:bounce;animation-duration:.85s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
#tl[data-a="none"] .ev{animation:none}
@keyframes slide{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes zoom{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes bounce{from{opacity:0;transform:translateY(32px) scale(.96)}to{opacity:1;transform:none}}
.ev b{display:block;font-size:14px}
.ev.rest{background:color-mix(in srgb,var(--now) 10%,var(--card));border:1.5px dashed var(--now);box-shadow:none}
.ev.free{background:transparent;border:1px dashed var(--ln);color:var(--mut);box-shadow:none}
.ev.role{background:var(--bg);border:1px solid var(--ln)}
.ev.role,.ev.rest,.ev.free{padding:14px 20px;font-size:16px;border-radius:16px}
.ev.role b,.ev.rest b{font-size:18px;margin-bottom:3px}
.ev.role{border-left:6px solid var(--tx)}.ev.rest{border-left:6px solid var(--now)}
#nowl{position:absolute;left:-6px;right:0;height:0;border-top:2px solid var(--now);z-index:3;transition:top 1s linear}
#nowl::before,#nowl::after{content:"";position:absolute;left:0;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--now)}
#nowl::after{animation:ping 2s ease-out infinite;background:transparent;border:2px solid var(--now)}
#nowl span{position:absolute;right:0;top:-22px;font-size:12px;color:var(--now);font-weight:700;background:var(--card);padding:0 6px;border-radius:6px}
.tools{display:flex;flex-wrap:wrap;gap:10px}
button.t{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:14px;transition:transform .15s,box-shadow .25s}
button.t:hover{box-shadow:var(--sh);transform:translateY(-1px)}button.t:active{transform:scale(.97)}
input[type=time]{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:7px}
#msg{font-size:13px;color:var(--mut);min-height:20px}
#gate{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);padding:20px}
#gate.on{display:flex}
#pet{display:flex;align-items:center;gap:14px;margin:0 0 24px}
#wm{background:none;border:0;padding:0;cursor:pointer;flex:none;transition:transform .3s}
#wm:hover{transform:scale(1.06) rotate(-3deg)}#wm:active{transform:scale(.94)}
#wm svg{width:96px;height:auto;display:block;transition:width .35s cubic-bezier(.2,.7,.2,1)}
#pet.hide #wm svg{width:56px}
.bub{position:relative;flex:1;background:var(--card);border:1px solid var(--ln);border-radius:18px;box-shadow:var(--sh);padding:14px 40px 14px 18px;animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards}
.bub::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:var(--card);border-left:1px solid var(--ln);border-bottom:1px solid var(--ln);transform:translateY(-50%) rotate(45deg)}
#ph{font-size:15px;line-height:1.45;font-style:italic}
#hd{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--mut);cursor:pointer;font-size:14px;border-radius:8px;width:28px;height:28px}
#hd:hover{background:var(--bg)}
#pet{--wb:#6cc04a;--ws:color-mix(in srgb,var(--wb) 68%,#000);--wh:color-mix(in srgb,var(--wb) 86%,#fff)}
.pal{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--ln);cursor:pointer;padding:0;transition:transform .15s,box-shadow .2s}
.sw:hover{transform:scale(1.18)}.sw.on{box-shadow:0 0 0 2px var(--tx)}
.pre{width:40px;height:24px;border-radius:12px;border:2px solid var(--card);box-shadow:0 0 0 1px var(--ln);cursor:pointer;padding:0;transition:transform .15s,box-shadow .2s}
.pre:hover{transform:scale(1.12)}.pre.on{box-shadow:0 0 0 2px var(--tx)}
#pn{font-size:12px;color:var(--mut);margin-top:6px}#pet.talk #pn{display:none}
#wm svg g:first-of-type circle:nth-child(1){fill:var(--c1,var(--wb))}
#wm svg g:first-of-type circle:nth-child(2){fill:var(--c2,var(--wb))}
#wm svg g:first-of-type circle:nth-child(3){fill:var(--c3,var(--wb))}
#wm svg g:first-of-type circle:nth-child(4){fill:var(--c4,var(--wb))}
#wm svg g:first-of-type circle:nth-child(5){fill:var(--c5,var(--wb))}
#wm circle[r="2"]{fill:var(--pu,#1d1d1b)}
#cp{width:28px;height:28px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
#cp::-webkit-color-swatch-wrapper{padding:0}#cp::-webkit-color-swatch{border:0;border-radius:50%}#cp::-moz-color-swatch{border:0;border-radius:50%}
#pet.hide .bub{display:none}
.sg{transform-box:fill-box;transform-origin:center;animation:wig 1.8s ease-in-out infinite;animation-delay:var(--d)}
@keyframes wig{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#pet.talk{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:6}
#pet.hide.talk .bub{display:block}
#pet.talk #wm svg{width:84px}
#pet.talk .bub{background:var(--warn);color:#1d1d1b;border-color:#d9c400;font-weight:600;font-size:17px;animation:rise .4s cubic-bezier(.2,.7,.2,1) backwards,glow 2s ease-in-out .4s infinite}
#pet.talk .bub::before{background:var(--warn);border-color:#d9c400}
#pet.talk #ph{font-style:normal;font-size:17px}
#pet.talk #ph small{display:block;font-weight:400;font-size:14px;margin-top:2px}
#pet.talk .pal,#pet.talk #hd,#pet.talk .lab{color:#1d1d1b}#pet.talk .pal,#pet.talk #hd{display:none}
#pet.talk .sg{animation-name:hop;animation-duration:.7s}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
#gate .box{background:var(--card);border:1px solid var(--ln);border-radius:20px;box-shadow:var(--sh);padding:24px;width:100%;max-width:340px;animation:rise .35s cubic-bezier(.2,.7,.2,1)}
#gate input{width:100%;margin:14px 0 6px;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:16px}
#gate .er{color:var(--now);font-size:13px;min-height:18px}
#gate .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(226,35,26,0)}50%{box-shadow:0 0 0 7px rgba(226,35,26,.18)}}
@media (prefers-reduced-motion:reduce){*,*::after,*::before{animation:none!important;transition:none!important}}
</style></head><body><main>
<header><div><h1>Mi horario</h1><div class="mut" id="wk"></div></div><div class="hb"><button id="an" aria-label="Cambiar animación">✨ Subir</button><button id="th" aria-label="Cambiar tema">🌙</button></div></header>
<div id="pet"><button id="wm" title="Mostrar u ocultar mascota" aria-label="Mostrar u ocultar mascota"><svg viewBox="0 0 120 70" aria-hidden="true"><g style="fill:var(--wb);stroke:var(--ws)" stroke-width="2.5"><circle class="sg" style="--d:0s" cx="104" cy="48" r="8"/><circle class="sg" style="--d:.15s" cx="91" cy="42" r="10"/><circle class="sg" style="--d:.3s" cx="76" cy="48" r="11"/><circle class="sg" style="--d:.45s" cx="61" cy="42" r="12"/><circle class="sg" style="--d:.6s" cx="46" cy="48" r="13"/></g><g class="sg" style="--d:.75s"><circle cx="28" cy="40" r="17" style="fill:var(--wh);stroke:var(--ws)" stroke-width="2.5"/><circle cx="22" cy="36" r="4.5" fill="#fff"/><circle cx="34" cy="36" r="4.5" fill="#fff"/><circle cx="21" cy="37" r="2" fill="#1d1d1b"/><circle cx="33" cy="37" r="2" fill="#1d1d1b"/><path d="M21 46 Q28 52 36 46" fill="none" stroke="#1d1d1b" stroke-width="2" stroke-linecap="round"/></g></svg></button><div class="bub"><p class="lab" id="lb" style="margin:0 0 4px">Frase del día</p><div id="ph"></div><div class="pal" id="pal"></div><div class="pal" id="pre" style="margin-top:8px"></div><div id="pn"></div><button id="hd" aria-label="Ocultar mascota">✕</button></div></div>
<div class="sec"><p class="lab">Materia</p><div class="row" id="subs"></div></div>
<div class="sec"><p class="lab">Día</p><div class="seg" id="days"></div></div>
<div id="alert"></div>
<div class="card"><div id="tl"></div></div>
<div class="sec"><p class="lab">Horario y roles</p><div class="tools">
<button class="t" id="up">Reemplazar horario (imagen)</button><input type="file" id="f" accept="image/*" hidden>
<button class="t" id="rs">Restaurar 9–13 nov</button>
<button class="t" id="upr">Reemplazar roles (imagen)</button><input type="file" id="fr" accept="image/*" hidden>
<button class="t" id="rsr">Restaurar roles</button>
<label class="mut">Hora de prueba <input type="time" id="sim"></label></div></div>
<p id="msg"></p>
<div id="gate"><div class="box"><b>Contraseña requerida</b><div class="mut">Para cambiar el horario o los roles.</div><input id="pw" type="password" autocapitalize="characters" autocomplete="off" placeholder="Contraseña"><div class="er" id="er"></div><div class="bt"><button class="t" id="gc">Cancelar</button><button class="t" id="go">Entrar</button></div></div></div>
</main>
<script>
const S=["Matemáticas","Humanidades","StudyHall","CODE","Ajedrez","Inglés","Lecto"];
const COL={"Matemáticas":["#4a86c7","#fff"],"Humanidades":["#ffe94a","#1d1d1b"],"StudyHall":["#7b2a4a","#fff"],"CODE":["#f5951d","#1d1d1b"],"Ajedrez":["#e83be0","#fff"],"Inglés":["#e2231a","#fff"],"Lecto":["#2e8b2e","#fff"]};
const T={"Matemáticas":"Gabriel","Humanidades":"Alma","StudyHall":"Study hall","CODE":"Christian","Ajedrez":"Edgar","Inglés":"Lorena","Lecto":"Diego"};
const MEN=[[480,540],[585,630],[630,690],[720,780],[780,840],[840,900]];
const MAY=[[480,540],[540,600],[645,690],[690,750],[780,840],[840,900]];
const RC=[["m",0,540,585],["M",0,600,645],["m",1,690,720],["M",1,750,780]];
let ENT={Alma:"Abrir puertas",Lorena:"Abrir puertas",Gabriel:"Abrir puertas",Diego:"Cancha de fútbol","Study hall":"Patio delantero",Edgar:"Cafetera",Christian:"Baños pasillo delantero"};
let SAL={Gabriel:"Puerta",Diego:"Orden rotación menor",Lorena:"Orden rotación mayor",Christian:"Abrir puertas","Study hall":"Abrir puertas",Alma:"Abrir puertas"};
let DESC={"Abrir puertas":"Ayudar al alumno a bajar del auto y sus cosas, dirigirlo a la escuela.","Cancha de fútbol":"Cuidar baños, que no jueguen en la cancha ni vayan a los salones traseros.","Patio delantero":"Que no jueguen en el jardín ni vayan al área de preescolar.","Cafetera":"Que no usen tazas ni coman azúcar.","Baños pasillo delantero":"Vigilar baños, que no jueguen dentro.","Puerta":"Cuidar la salida de estudiantes (no moverse de la puerta).","Orden rotación menor":"Mantener el orden en la zona de salida, apurar a los alumnos.","Orden rotación mayor":"Mantener el orden en la salida; repetir nombres del megáfono.","Comedor":"Que nadie deje platos en el comedor; buen uso del mobiliario.","Patio trasero":"Cuidar el equipo de deportes y vigilar la cancha.","Tarja":"Que laven bien platos y cubiertos y tiren la comida a la basura."};
let RR=[{role:"Comedor",menor:"C",mayor:"D",only:0},{role:"Patio trasero",menor:"B2",mayor:"E",only:0},{role:"Patio delantero",menor:"B1",mayor:"F",only:2},{role:"Tarja",menor:"D",mayor:"F",only:1}];
const RD=JSON.stringify({ENT,SAL,DESC,RR});
const GM=["A","B1","B2","C"],GY=["D","E","F"];
const AO=[0,6,5,4,3],DO=[4,3,2,1,0];
function def(){const days=[];for(let d=0;d<5;d++){const o={};GM.forEach((g,i)=>o[g]=[0,1,2,3,4,5].map(r=>S[(AO[d]+i+r)%7]));GY.forEach((g,i)=>o[g]=[0,1,2,3,4,5].map(r=>S[(DO[d]+i+r)%7]));days.push(o)}return{label:"9 al 13 de noviembre 2026",days}}
let sch=def(),sub="Lecto",day=0;
try{const rl=localStorage.getItem("roles");if(rl){const o=JSON.parse(rl);ENT=o.ENT;SAL=o.SAL;DESC=o.DESC;RR=o.RR}}catch(e){}
try{const a=localStorage.getItem("sch");if(a)sch=JSON.parse(a);const b=localStorage.getItem("sub");if(S.includes(b))sub=b}catch(e){}
const wd=new Date().getDay();day=wd>=1&&wd<=5?wd-1:0;
const DN=["Lun","Mar","Mié","Jue","Vie"];
const fm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const $=id=>document.getElementById(id),PX=2.4,T0=450;
function theme(t){document.documentElement.dataset.theme=t;$("th").textContent=t==="dark"?"☀️":"🌙";try{localStorage.setItem("th",t)}catch(e){}}
let th=null;try{th=localStorage.getItem("th")}catch(e){}
theme(th||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
$("th").onclick=()=>theme(document.documentElement.dataset.theme==="dark"?"light":"dark");
function slots(d){const r=[];[...GM,...GY].forEach(g=>{const tm=GM.includes(g)?MEN:MAY;(sch.days[d][g]||[]).forEach((s,i)=>r.push({g,s:tm[i][0],e:tm[i][1],subj:s}))});return r}
function events(d,sb){const mine=slots(d).filter(x=>x.subj===sb).sort((a,b)=>a.s-b.s),tc=T[sb],ev=[];
ev.push({s:450,e:480,k:"role",n:"Entrada",role:ENT[tc]});
mine.forEach(x=>ev.push({s:x.s,e:x.e,k:"class",n:"Clase · grupo "+x.g}));
const fr=[];let c=480;mine.forEach(x=>{if(x.s>c)fr.push([c,x.s]);c=Math.max(c,x.e)});if(c<900)fr.push([c,900]);
fr.forEach(([a,b])=>{const pts=[a,b];RC.forEach(r=>[r[2],r[3]].forEach(p=>{if(p>a&&p<b)pts.push(p)}));pts.sort((x,y)=>x-y);
for(let i=0;i<pts.length-1;i++){const p=pts[i],q=pts[i+1],r=RC.find(r=>p>=r[2]&&q<=r[3]);
if(r){const last=mine.filter(x=>x.e<=p).sort((x,y)=>y.e-x.e)[0];let role=null;
if(last){const g=last.g,k=RR.find(z=>z[r[0]==="m"?"menor":"mayor"]===g&&(r[0]==="m"||!z.only||z.only===r[1]+1));role=k?k.role:null}
ev.push({s:p,e:q,k:"rest",n:"Descanso",role})}
else ev.push({s:p,e:q,k:"free",n:"Hora libre"})}});
ev.push({s:900,e:930,k:"role",n:"Salida",role:SAL[tc]});
return ev.sort((a,b)=>a.s-b.s)}
function nowMin(){const v=$("sim").value;if(v){const[h,m]=v.split(":").map(Number);return h*60+m+0.5}const n=new Date();return n.getHours()*60+n.getMinutes()+n.getSeconds()/60}
function head(){$("wk").textContent="Semana: "+sch.label;
$("subs").innerHTML="";S.forEach(s=>{const b=document.createElement("button");b.className="chip"+(s===sub?" on":" off");b.style.background=COL[s][0];b.style.color=COL[s][1];b.textContent=s;b.onclick=()=>{sub=s;try{localStorage.setItem("sub",s)}catch(e){}head();draw()};$("subs").append(b)});
$("days").innerHTML="";DN.forEach((n,i)=>{const b=document.createElement("button");b.className="day"+(i===day?" on":"");b.textContent=n;b.onclick=()=>{day=i;head();draw()};$("days").append(b)})}
function draw(){const ev=events(day,sub),tl=$("tl");tl.style.height=(930-T0)*PX+"px";tl.innerHTML="";
for(let m=480;m<=930;m+=60){const t=document.createElement("div");t.className="tick";t.style.top=(m-T0)*PX+"px";t.textContent=fm(m);tl.append(t)}
ev.forEach((x,i)=>{const d=document.createElement("div");d.className="ev "+x.k;d.style.setProperty("--i",i);d.style.top=(x.s-T0)*PX+"px";d.style.height=(x.e-x.s)*PX-4+"px";
if(x.k==="class"){const c=COL[sub];d.style.background=c[0];d.style.color=c[1]}
d.innerHTML="<b>"+x.n+" · "+fm(x.s)+"–"+fm(x.e)+"</b>"+(x.role?"Rol: "+x.role:x.k==="rest"?"Sin rol":"");tl.append(d)});
const nl=document.createElement("div");nl.id="nowl";nl.innerHTML="<span></span>";tl.append(nl);last="";tick()}
let last="";
function tick(){const n=nowMin(),ev=events(day,sub),nl=$("nowl");if(!nl)return;
const real=$("sim").value||new Date().getDay()-1===day;
nl.style.display=real&&n>=T0&&n<=930?"block":"none";nl.style.top=(n-T0)*PX+"px";nl.firstChild.textContent=fm(Math.floor(n));

if(!real)h="Mostrando "+DN[day]+". La línea de “ahora” aparece solo el día de hoy.";
